name: Bug report
description: Report a reproducible code, inference or artifact compatibility issue.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain the failure without including private source records.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command or a minimal redacted request and error.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and model identity
      description: Include OS, Python/dependency versions, model identifier/version and dataset fingerprint where relevant.
    validations:
      required: true
